<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Puup 1v1 Showdown</title>
<meta name="description" content="Puup Discord League of Legends 1v1 tournament: sign up, bracket, live results and crowd votes.">
<meta name="theme-color" content="#0a0f17">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpolygon points='32,2 60,18 60,46 32,62 4,46 4,18' fill='%23c8a55a'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-weight='700' font-size='30' text-anchor='middle' fill='%231a1408'%3EP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Inter:wght@400;500;600;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style id="css">
/* Layout: one dark column; hero countdown, live banner, scrollable bracket, then prizes, players, rules. Owner-only admin drawer slides in from the right. */
:root{
  --bg:#0a0f17; --bg2:#101826; --panel:#141e2e; --line:#24324a;
  --fg:#e8e2d0; --mute:#8d97a8; --gold:#c8a55a; --gold2:#f0d58c; --teal:#3fb7c4; --red:#e0605a;
  --display:"Cinzel","Trajan Pro",Georgia,serif; --body:"Inter",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  background-image:radial-gradient(1200px 500px at 50% -120px,#1b2a44 0%,transparent 70%);min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
a{color:var(--teal)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.02em}
h2{font-size:1.35rem;color:var(--gold2);display:flex;align-items:center;gap:12px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
section{margin-top:44px}
.eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:.72rem;color:var(--gold);font-weight:600}
.mute{color:var(--mute)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* hero */
.hero{text-align:center;padding-block:48px 8px;display:grid;gap:14px;justify-items:center}
.hero h1{font-size:clamp(2rem,7vw,3.6rem);font-weight:800;color:var(--gold2);line-height:1.05;
  text-shadow:0 2px 24px rgba(200,165,90,.25)}
.when{color:var(--mute);font-size:.95rem}
.count{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.unit{min-width:78px;padding:12px 10px 8px;background:linear-gradient(180deg,#172338,#0f1726);border:1px solid var(--line);
  border-top:2px solid var(--gold);display:grid;gap:2px}
.unit b{font-family:var(--display);font-size:clamp(1.8rem,7vw,2.8rem);color:var(--fg);font-variant-numeric:tabular-nums;line-height:1}
.unit span{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.livepill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border:1px solid var(--red);color:#ffd6d3;
  font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.8rem}
.livepill i{width:9px;height:9px;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border:1px solid var(--gold);background:linear-gradient(180deg,#2a2414,#17140c);
  color:var(--gold2);font-weight:600;text-decoration:none;letter-spacing:.04em}
.btn:hover{background:#3a3119}
.btn.ghost{border-color:var(--line);background:transparent;color:var(--fg)}
.nav{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:18px;font-size:.85rem}
.nav a{color:var(--mute);text-decoration:none;text-transform:uppercase;letter-spacing:.12em}
.nav a:hover{color:var(--gold2)}

/* champion */
.champ{margin-top:8px;padding:28px 20px;border:1px solid var(--gold);background:radial-gradient(circle at 50% 0,#3a2f14,#141a26 70%);display:grid;gap:6px;justify-items:center;width:100%;max-width:560px}
.champ .name{font-family:var(--display);font-size:clamp(2rem,8vw,3.2rem);color:var(--gold2);font-weight:800;animation:rise .9s ease-out both}
@keyframes rise{from{transform:translateY(12px) scale(.96);opacity:.3}to{transform:none;opacity:1}}

/* live banner */
.live{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:18px 20px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--red)}
.live .vs{font-family:var(--display);font-size:clamp(1.2rem,4.5vw,1.7rem);display:flex;flex-wrap:wrap;gap:10px;align-items:baseline}
.live .vs em{font-style:normal;color:var(--mute);font-size:.8em}
.live .side{min-width:0}
.next{margin-top:10px;color:var(--mute);font-size:.9rem}
.next b{color:var(--fg);font-weight:600}
@media (max-width:640px){.live{grid-template-columns:1fr}}
.pick{display:flex;height:8px;margin-top:10px;max-width:420px;background:var(--line)}
.pick .pa{background:var(--teal)}.pick .pb{background:var(--red)}
.picklbl{display:flex;justify-content:space-between;max-width:420px;font-size:.75rem;color:var(--mute);margin-top:4px}

/* bracket */
.bscroll{overflow-x:auto;margin-top:18px;padding-bottom:10px}
.bracket{display:flex;gap:28px;min-width:max-content}
.round{display:flex;flex-direction:column;width:250px}
.round h3{font-size:.8rem;color:var(--gold);text-transform:uppercase;letter-spacing:.14em;font-family:var(--body);font-weight:600;margin-bottom:4px}
.round .fmt{font-size:.7rem;color:var(--mute);margin-bottom:10px}
.matches{display:flex;flex-direction:column;justify-content:space-around;flex:1;gap:14px}
.match{background:var(--panel);border:1px solid var(--line);position:relative}
.match.dead{visibility:hidden}
.match.islive{border-color:var(--red);box-shadow:0 0 0 1px var(--red),0 0 18px rgba(224,96,90,.25)}
.match .tag{position:absolute;top:-9px;right:8px;font-size:.62rem;letter-spacing:.14em;background:var(--red);color:#fff;padding:1px 6px;font-weight:700}
.slot{display:flex;align-items:center;gap:8px;padding:7px 10px;min-height:36px;width:100%;border:0;background:transparent;color:inherit;text-align:left}
.slot+.slot{border-top:1px solid var(--line)}
.slot .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.slot .sc{font-variant-numeric:tabular-nums;font-weight:700;color:var(--mute);min-width:14px;text-align:right}
.slot.win{background:linear-gradient(90deg,rgba(200,165,90,.18),transparent)}
.slot.win .n{color:var(--gold2)} .slot.win .sc{color:var(--gold2)}
.slot.lose .n{color:var(--mute);text-decoration:line-through;text-decoration-color:rgba(141,151,168,.5)}
.slot.empty .n{color:#56627a;font-style:italic;font-weight:400}
.admin-on .slot.clickable:hover{background:rgba(63,183,196,.12)}
.admin-on .slot.clickable{cursor:pointer}
.side3{margin-top:26px}
.empty-state{margin-top:16px;padding:28px;border:1px dashed var(--line);text-align:center;color:var(--mute)}

/* champion art */
.ic{width:22px;height:22px;flex:0 0 auto;border:1px solid var(--gold);background-color:#0b111b;background-repeat:no-repeat;display:inline-block;vertical-align:middle}
.ic.big{width:44px;height:44px}
.cstrip{display:flex;gap:4px;padding:5px 10px;border-top:1px solid var(--line);align-items:center;font-size:.7rem;color:var(--mute)}
.cstrip .ic{opacity:.55}.cstrip .ic.now{opacity:1;box-shadow:0 0 0 1px var(--gold2),0 0 8px rgba(240,213,140,.5)}
.live .champnow{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:.9rem;color:var(--mute)}
.live .champnow b{color:var(--gold2)}

/* profile icons */
.pav{width:24px;height:24px;flex:0 0 auto;border-radius:50%;border:1px solid var(--gold);background-color:#0b111b;background-repeat:no-repeat;display:inline-block}
.pav.md{width:44px;height:44px}.pav.lg{width:84px;height:84px;border-width:2px}
.pcard{grid-template-columns:auto 1fr;column-gap:12px;align-items:center}
.pcard .pav{grid-row:span 4}
.iconpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin-top:12px;max-height:60vh;overflow-y:auto;padding:4px}
.iconpick button{aspect-ratio:1;border:2px solid transparent;border-radius:50%;padding:0;background-color:#0b111b;background-repeat:no-repeat;cursor:pointer}
.iconpick button:hover{border-color:var(--teal)}.iconpick button.sel{border-color:var(--gold2);box-shadow:0 0 12px rgba(240,213,140,.5)}
.pickbtn{display:flex;align-items:center;gap:8px;grid-column:1/-1}

/* games list (bracket) */
.glist{border-top:1px solid var(--line);padding:4px 0;display:grid}
.grow{display:grid;grid-template-columns:22px 20px minmax(0,1fr) auto;gap:6px;align-items:center;padding:3px 10px;font-size:.74rem;line-height:1.2}
.grow .gn{color:var(--mute);font-weight:700;font-size:.62rem;letter-spacing:.06em}
.grow .gi{width:20px;height:20px;border:1px solid var(--line);background-color:#0b111b;background-repeat:no-repeat}
.grow .gc{color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow .gw{font-weight:700;color:var(--gold2);white-space:nowrap;max-width:96px;overflow:hidden;text-overflow:ellipsis;text-align:right}
.grow.cur{background:rgba(224,96,90,.10)}
.grow.cur .gw{color:#ffb3ae;font-size:.62rem;letter-spacing:.14em}
.grow.idle .gc,.grow.idle .gw{color:#56627a;font-weight:400}
.grow.skip{opacity:.35}

/* vote cards */
.vote{margin-top:16px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:stretch}
.vcard{position:relative;padding:18px 14px 16px;background:linear-gradient(180deg,#16233a,var(--panel));border:1px solid var(--line);display:grid;justify-items:center;gap:6px;text-align:center;overflow:hidden;min-width:0}
.vcard.a{border-top:3px solid var(--teal)}.vcard.b{border-top:3px solid var(--red)}
.vcard .vn{font-family:var(--display);font-weight:800;font-size:clamp(1rem,3.6vw,1.35rem);overflow-wrap:anywhere}
.vcard .vr{font-size:.78rem;color:var(--mute);overflow-wrap:anywhere}
.vcard .vp{font-family:var(--display);font-size:clamp(1.6rem,6vw,2.4rem);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.vcard.a .vp{color:var(--teal)}.vcard.b .vp{color:var(--red)}
.vcard.lead{box-shadow:0 0 0 1px var(--gold),0 0 22px rgba(200,165,90,.2)}
.vcard .vbar{position:absolute;left:0;bottom:0;height:4px}
.vcard.a .vbar{background:var(--teal)}.vcard.b .vbar{background:var(--red)}
.vmid{display:grid;place-items:center;font-family:var(--display);font-weight:800;color:var(--gold);font-size:1.2rem}
.vnote{grid-column:1/-1;text-align:center;font-size:.78rem;color:var(--mute)}
@media (max-width:520px){.vote{gap:6px}.vcard{padding:14px 8px}.pav.lg{width:60px;height:60px}}

/* sign-up */
.suform{display:grid;gap:12px;text-align:left;margin-top:12px}
.suform .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.suform .two{grid-template-columns:1fr}}
.suform label{font-size:.8rem}
.suform input{padding:10px 12px;font-size:.95rem}
.suform .iconpick{max-height:240px;margin-top:4px}
.suerr{color:#ffb3ae;font-size:.82rem;min-height:1.2em;margin:0}
.suok{display:grid;justify-items:center;gap:8px;padding:10px 0}
.suok .vn{font-family:var(--display);font-size:1.5rem;color:var(--gold2);font-weight:800}
.preview-tag{font-size:.72rem;color:var(--teal);border:1px dashed var(--teal);padding:4px 8px;justify-self:center}

/* champion picker */
.cbox{position:relative}
.cbox .cin{display:flex;align-items:center;gap:8px;background:#0b111b;border:1px solid var(--line);padding:4px 8px}
.cbox .cin:focus-within{border-color:var(--gold)}
.cbox .cin input{border:0;background:transparent;padding:5px 0;outline:none}
.cbox .cin .ic{width:26px;height:26px}
.cbox .clr{border:0;background:none;color:var(--mute);font-size:1rem;padding:0 4px;cursor:pointer}
.cmenu{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:60;background:#0e1626;border:1px solid var(--gold);box-shadow:0 14px 30px rgba(0,0,0,.6);max-height:264px;overflow-y:auto;margin:0;padding:4px;list-style:none}
.cmenu li{display:flex;align-items:center;gap:10px;padding:6px 8px;cursor:pointer;color:var(--fg);font-size:.88rem}
.cmenu li .ic{width:28px;height:28px}
.cmenu li.act,.cmenu li:hover{background:linear-gradient(90deg,rgba(200,165,90,.22),transparent);color:var(--gold2)}
.cmenu .none{color:var(--mute);cursor:default}

/* ===== bracket v2 (broadcast style) ===== */
html,body{overflow-x:clip}
@property --spin{syntax:"<angle>";inherits:false;initial-value:0deg}
.bscroll{overflow-x:auto;margin-top:14px;padding-bottom:12px;scrollbar-color:var(--line) transparent;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bstage{position:relative;margin:0 auto}
.blines{position:absolute;inset:0;overflow:visible}
.ln{fill:none;stroke-width:2;stroke-linejoin:round}
.ln.base{stroke:#22314b}
.ln.bye{stroke:#3a4a66;stroke-dasharray:3 5}
.ln.won{stroke:var(--gold);stroke-width:2.5;filter:drop-shadow(0 0 4px rgba(240,213,140,.7))}
.ln.won.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:lndraw .9s ease-out forwards}
@keyframes lndraw{to{stroke-dashoffset:0}}
.ln.flow{stroke:#fff6d8;stroke-width:2;stroke-dasharray:6 22;opacity:.55;animation:lnflow 1.6s linear infinite}
@keyframes lnflow{to{stroke-dashoffset:-28}}
.bhead{position:absolute;top:0;height:46px;display:flex;flex-direction:column;justify-content:center;padding:0 14px;
  background:linear-gradient(90deg,#1b2a44,#121b2c);clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%);border-left:3px solid var(--gold)}
.bhead .bht{font-family:var(--display);font-weight:800;color:var(--gold2);letter-spacing:.06em;font-size:.95rem}
.bhead .bhf{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.bhead.champ{background:linear-gradient(90deg,#3a2f14,#1a1710);border-left-color:var(--gold2)}
.bsub{position:absolute;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700}
.bcard{position:absolute;width:var(--cw,268px);filter:drop-shadow(0 8px 18px rgba(0,0,0,.55))}
@media (max-width:639px){.bcard{--cw:236px}}
.bcard .binner{position:relative;background:linear-gradient(160deg,#18253d 0%,#111a2b 60%,#0e1624 100%);
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);border-left:3px solid #2b3c5c}
.bcard.decided .binner{border-left-color:var(--gold)}
.bcard.isbye{opacity:.7}
.bcard.enter{animation:bin .6s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes bin{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.bcard.onair::before{content:"";position:absolute;inset:-3px;clip-path:polygon(13px 0,100% 0,100% calc(100% - 13px),calc(100% - 13px) 100%,0 100%,0 13px);
  background:conic-gradient(from var(--spin),var(--red),#ffb36b,var(--gold2),var(--red) 40%,transparent 55%,var(--red));animation:spin 2.4s linear infinite}
.bcard.onair{filter:drop-shadow(0 0 16px rgba(224,96,90,.45))}
@keyframes spin{to{--spin:360deg}}
.blive{position:absolute;z-index:3;top:-11px;right:12px;display:inline-flex;align-items:center;gap:5px;background:var(--red);color:#fff;font-size:.62rem;font-weight:800;letter-spacing:.16em;padding:2px 8px;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.blive i{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1s infinite}
.bp{display:grid;grid-template-columns:34px minmax(0,1fr) 42px;align-items:center;gap:10px;height:48px;padding:0 0 0 10px;width:100%;border:0;background:transparent;color:inherit;text-align:left;font:inherit;position:relative}
.bp+.bp{border-top:1px solid rgba(255,255,255,.05)}
.bav{width:34px;height:34px;background-color:#0b111b;background-repeat:no-repeat;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);box-shadow:inset 0 0 0 1px rgba(200,165,90,.5)}
.bp.empty .bav{background:repeating-linear-gradient(45deg,#16223a 0 4px,#121b2d 4px 8px)}
.bnm{display:grid;min-width:0;line-height:1.15}
.bn{font-weight:700;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brid{font-size:.68rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bp.empty .bn{color:#56627a;font-style:italic;font-weight:500}
.bsc{height:100%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.15rem;background:rgba(0,0,0,.28);color:var(--mute);font-variant-numeric:tabular-nums}
.bp.win .bsc{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1408}
.bp.win .bn{color:var(--gold2)}
.bp.win::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,240,200,.18) 50%,transparent 70%);background-size:250% 100%;animation:shine 3.5s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%{background-position:150% 0}60%,100%{background-position:-60% 0}}
.bp.lose{opacity:.42}
.bp.lose .bn{text-decoration:line-through;text-decoration-color:rgba(141,151,168,.6)}
.bp.clickable{cursor:pointer}
.bp.clickable:hover{background:rgba(63,183,196,.12)}
.bp.clickable:hover .bsc{color:var(--teal)}
.bgames{padding:6px 8px 8px;display:grid;gap:2px;background:rgba(0,0,0,.18);border-top:1px solid rgba(200,165,90,.18)}
.bg{display:grid;grid-template-columns:22px 22px minmax(0,1fr) auto;gap:7px;align-items:center;height:24px;padding:0 6px;font-size:.72rem}
.bgn{font-size:.6rem;font-weight:800;letter-spacing:.08em;color:var(--mute)}
.bgi{width:22px;height:22px;background-color:#0b111b;background-repeat:no-repeat;box-shadow:inset 0 0 0 1px #2b3c5c}
.bgc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#6b7891}
.bg.done .bgc{color:var(--fg)}
.bgw{display:inline-flex;align-items:center;gap:5px;font-weight:700;max-width:100px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--gold2)}
.bgav{width:20px;height:20px;border-radius:50%;flex:0 0 auto;background-repeat:no-repeat;box-shadow:0 0 0 1px var(--gold)}
.bg.done{background:linear-gradient(90deg,rgba(200,165,90,.10),transparent)}
.bg.cur{background:linear-gradient(90deg,rgba(224,96,90,.22),transparent)}
.bglive{font-size:.6rem;font-weight:800;letter-spacing:.16em;color:#ffb3ae;animation:pulse 1.2s infinite}
.bg.skip{opacity:.3}
.bchamp{position:absolute;height:180px;display:grid;justify-items:center;align-content:center;gap:6px;text-align:center;
  background:radial-gradient(circle at 50% 30%,#2a2414,#121a28 70%);border:1px solid #3a3220;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.bchamp .bcn{font-family:var(--display);font-weight:800;font-size:1.05rem;color:var(--mute)}
.bchamp .trophy{opacity:.35;filter:grayscale(.6)}
.bchamp.crowned{border-color:var(--gold);box-shadow:inset 0 0 40px rgba(240,213,140,.18)}
.bchamp.crowned .trophy{opacity:1;filter:drop-shadow(0 0 14px rgba(240,213,140,.7));animation:float 3s ease-in-out infinite}
.bchamp.crowned .bcn{color:var(--gold2);font-size:1.3rem}
.bav.big{width:52px;height:52px}
@keyframes float{50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.ln.won.draw{stroke-dashoffset:0}.ln.flow{display:none}}

.vcard.clickable{cursor:pointer;font:inherit;color:inherit;transition:transform .15s ease, box-shadow .2s ease}
.vcard.clickable:hover{transform:translateY(-3px);box-shadow:0 0 0 1px var(--gold2),0 10px 24px rgba(0,0,0,.4)}
.vcard.clickable:active{transform:scale(.98)}
.vcard .vc{font-size:.75rem;color:var(--mute);font-variant-numeric:tabular-nums}
.vcard .vtap{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);opacity:.8}
.vcard.bump .vp{animation:bump .5s ease-out}
@keyframes bump{40%{transform:scale(1.25)}}

/* ===== stream view (16:9 broadcast) ===== */
.stream{position:fixed;inset:0;z-index:30;display:grid;grid-template-rows:auto minmax(0,1fr) auto;color:var(--fg);
  background:radial-gradient(1200px 600px at 15% -10%,#1d3050 0%,transparent 60%),radial-gradient(900px 500px at 100% 110%,#2a2210 0%,transparent 60%),#070b12}
.stream::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.07;
  background-image:linear-gradient(30deg,#c8a55a 1px,transparent 1px),linear-gradient(150deg,#c8a55a 1px,transparent 1px);background-size:56px 32px}
.sttop{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:14px 28px;background:linear-gradient(180deg,rgba(10,16,28,.95),rgba(10,16,28,.6));border-bottom:1px solid rgba(200,165,90,.35)}
.sttop::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--gold2),transparent);animation:sweep 6s ease-in-out infinite}
@keyframes sweep{0%,100%{opacity:.2}50%{opacity:1}}
.stbrand{display:flex;align-items:center;gap:14px;min-width:0}
.stmark{flex:0 0 auto;width:42px;height:42px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.4rem;color:#1a1408;background:linear-gradient(180deg,var(--gold2),var(--gold));clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.stname{font-family:var(--display);font-weight:800;font-size:1.35rem;color:var(--gold2);letter-spacing:.04em;white-space:nowrap}
.stsub{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stbrand > div{min-width:0}
.ststatus{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:600;letter-spacing:.08em;font-size:1rem;color:var(--fg);padding:8px 22px;background:rgba(0,0,0,.35);clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,14px 100%,0 50%)}
.stlive{display:inline-flex;align-items:center;gap:6px;background:var(--red);color:#fff;font-family:var(--body);font-weight:800;font-size:.7rem;letter-spacing:.18em;padding:3px 9px}
.stlive i{width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1s infinite}
.stright{display:flex;justify-content:flex-end;align-items:center;gap:10px}
.stclock{font-variant-numeric:tabular-nums;color:var(--mute);font-size:.9rem;margin-right:6px}
.stbtn{font:inherit;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);background:transparent;border:1px solid var(--line);padding:6px 12px;text-decoration:none;cursor:pointer;opacity:.55;transition:opacity .2s}
.stbtn:hover,.stream:hover .stbtn{opacity:1;color:var(--fg)}
.stbody{position:relative;overflow:hidden}
.stfit{position:absolute;left:50%;top:50%;transform-origin:center center}
.stfit .bcard{--cw:268px}
.stempty{display:grid;place-items:center;height:100%;color:var(--mute);font-size:1.2rem}
.stlow{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:0;margin:0 28px 22px;
  background:linear-gradient(180deg,#16233a,#0e1624);border:1px solid rgba(200,165,90,.45);clip-path:polygon(18px 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%,0 18px);box-shadow:0 -10px 40px rgba(0,0,0,.4);animation:lowin .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes lowin{from{transform:translateY(30px);opacity:0}}
.stl-tag{align-self:stretch;display:grid;align-content:center;padding:0 22px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1408;font-family:var(--display);font-weight:800;font-size:1rem;letter-spacing:.06em;text-transform:uppercase}
.stl-tag small{display:block;font-family:var(--body);font-weight:600;font-size:.65rem;letter-spacing:.12em;opacity:.75}
.stp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 20px;min-width:0}
.stp.b{grid-template-columns:auto minmax(0,1fr) auto;direction:rtl;text-align:right}
.stp.b > *{direction:ltr}
.stp .bav.big{width:58px;height:58px}
.stp-t{min-width:0;text-align:left;justify-self:stretch}.stp.b .stp-t{text-align:right}
.stp-n{font-family:var(--display);font-weight:800;font-size:1.5rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stp-r{font-size:.8rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stp-r b{color:var(--gold2);font-weight:600}
.stp-s{font-family:var(--display);font-weight:800;font-size:2.4rem;min-width:54px;text-align:center;color:var(--gold2);font-variant-numeric:tabular-nums}
.stp.a{border-left:3px solid var(--teal)}.stp.b{border-right:3px solid var(--red)}
.stmid{display:grid;justify-items:center;gap:4px;padding:8px 18px}
.stch{width:54px;height:54px;background-repeat:no-repeat;box-shadow:0 0 0 2px var(--gold),0 0 18px rgba(240,213,140,.4)}
.stvs{font-family:var(--display);font-weight:800;font-size:1.6rem;color:var(--gold)}
.stmid-t{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.stbar{position:absolute;left:0;right:0;bottom:0;height:4px;display:flex}
.stbar .a{background:var(--teal)}.stbar .b{background:var(--red)}
.stlow.champ{grid-template-columns:auto auto 1fr;gap:20px;padding:16px 26px;justify-items:start}
.stl-k{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.stl-n{font-family:var(--display);font-weight:800;font-size:2rem;color:var(--gold2)}
.stl-prize{justify-self:end;font-family:var(--display);font-weight:800;font-size:1.6rem;color:var(--fg)}
@media (max-width:900px){.sttop{grid-template-columns:1fr auto;padding:10px 14px}.ststatus{display:none}.stlow{margin:0 10px 10px;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}.stl-tag{display:none}.stp-n{font-size:1.05rem}.stp .bav.big{width:40px;height:40px}.stp-s{font-size:1.6rem;min-width:30px}.stp{padding:10px}}

.stp{border:0;background:transparent;color:inherit;font:inherit;width:100%;text-align:inherit}
.stp.clickable{cursor:pointer;transition:background .2s}
.stp.clickable:hover{background:rgba(255,255,255,.04)}
.stp.a.clickable:hover{box-shadow:inset 3px 0 0 var(--teal),inset 0 0 30px rgba(63,183,196,.15)}
.stp.b.clickable:hover{box-shadow:inset -3px 0 0 var(--red),inset 0 0 30px rgba(224,96,90,.15)}
.stp-r em{font-style:normal;color:var(--gold);opacity:.7}
.stp.bump .bav{animation:bump .5s ease-out}
.stcrowd{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.stcrowd b{font-family:var(--display);font-size:.95rem;letter-spacing:0}
.stcrowd b.a{color:var(--teal)}.stcrowd b.b{color:var(--red)}
.stbar{height:5px}
.stbar span{transition:width .6s ease}
.stlow.noanim{animation:none}

/* stream moments: full-screen splashes (intro, victory, podium) */
.fx{position:fixed;inset:0;z-index:80;overflow:hidden;color:var(--fg);font-family:var(--body);isolation:isolate;
  animation-name:fxin,fxout;animation-duration:.45s,.55s;animation-timing-function:ease,ease;animation-fill-mode:both,forwards;
  animation-delay:calc(0s - var(--el,0s)),calc(var(--dur,6s) - .55s - var(--el,0s))}
.fx.out{animation:fxout .4s ease forwards}
@keyframes fxin{from{opacity:0}}
@keyframes fxout{to{opacity:0;visibility:hidden}}
.fx .fa{animation-delay:calc(var(--d,0s) - var(--el,0s));animation-fill-mode:both;animation-duration:.8s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
.fxbg{position:absolute;inset:0;z-index:-2;background:radial-gradient(ellipse 70% 60% at 50% 50%,#172640 0%,#0a1220 55%,#05080e 100%)}
.fxbg::after{content:"";position:absolute;inset:0;opacity:.08;background-image:repeating-linear-gradient(115deg,#fff 0 1px,transparent 1px 7px)}
.fxclose{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));z-index:5;width:40px;height:40px;border-radius:50%;border:1px solid rgba(200,165,90,.5);background:rgba(10,16,28,.7);color:var(--gold2);font-size:1.4rem;line-height:1;opacity:0;transition:opacity .2s}
.fx:hover .fxclose,.fxclose:focus-visible{opacity:1}
@media (hover:none){.fxclose{opacity:.85}}
.fx .eyebrow{color:var(--gold);letter-spacing:.32em;font-size:clamp(.7rem,1.3vmin,1rem)}
.fxtop{position:absolute;left:0;right:0;top:7vh;text-align:center;display:grid;gap:6px;animation-name:fxdrop}
.fxround{font-family:var(--display);font-weight:800;font-size:clamp(1.4rem,4.4vmin,3.4rem);color:var(--gold2);letter-spacing:.06em;text-transform:uppercase;text-shadow:0 4px 30px rgba(200,165,90,.35)}
@keyframes fxdrop{from{opacity:0;transform:translateY(-24px)}}
@keyframes fxrise{from{opacity:0;transform:translateY(26px)}}
.fxav{display:inline-block;padding:4px;background:linear-gradient(135deg,var(--gold2),#7a5f2a 60%,var(--gold));clip-path:polygon(14% 0,100% 0,100% 86%,86% 100%,0 100%,0 14%);animation-name:fxpop}
.fxav > span{display:block;width:clamp(96px,22vmin,260px);aspect-ratio:1;background-color:#0b111b;background-repeat:no-repeat;clip-path:inherit}
@keyframes fxpop{0%{opacity:0;transform:scale(.55)}60%{opacity:1;transform:scale(1.06)}100%{transform:scale(1)}}
.fxname{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,5.4vmin,4.6rem);line-height:1.05;text-wrap:balance;animation-name:fxrise;max-width:100%;overflow-wrap:anywhere}
.fxriot{color:var(--mute);font-size:clamp(.85rem,1.8vmin,1.3rem);letter-spacing:.04em;animation-name:fxrise}
.fxriot b{color:var(--gold);font-weight:600}

/* intro: two halves crash in, VS slams down */
.fx.intro{display:grid;grid-template-columns:1fr 1fr}
.fxside{position:relative;display:grid;place-items:center;padding:16vh 6vw 18vh;min-width:0}
.fxside.a{background:linear-gradient(100deg,rgba(63,183,196,.32),rgba(63,183,196,.05) 70%,transparent);clip-path:polygon(0 0,100% 0,90% 100%,0 100%);margin-right:-5vw;animation-name:fxsl}
.fxside.b{background:linear-gradient(260deg,rgba(224,96,90,.32),rgba(224,96,90,.05) 70%,transparent);clip-path:polygon(10% 0,100% 0,100% 100%,0 100%);margin-left:-5vw;animation-name:fxsr}
.fxside.a .fxwho{padding-right:5vw}.fxside.b .fxwho{padding-left:5vw}
.fxside.a .fxav{background:linear-gradient(135deg,#a8f0f6,var(--teal) 55%,#1d5d64)}
.fxside.b .fxav{background:linear-gradient(135deg,#ffc4bf,var(--red) 55%,#6b2a27)}
.fxwho{display:grid;justify-items:center;gap:12px;text-align:center;min-width:0;max-width:100%}
@keyframes fxsl{from{transform:translateX(-105%)}}
@keyframes fxsr{from{transform:translateX(105%)}}
.fxseam{position:absolute;left:50%;top:-10%;bottom:-10%;width:3px;margin-left:-1.5px;background:linear-gradient(transparent,var(--gold2) 30%,var(--gold2) 70%,transparent);box-shadow:0 0 24px 4px rgba(240,213,140,.5);transform:skewX(-5.7deg);animation-name:fxseam;animation-duration:.6s}
@keyframes fxseam{from{opacity:0;transform:skewX(-5.7deg) scaleY(0)}}
.fxvs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);animation-name:fxslam;animation-duration:.55s;animation-timing-function:cubic-bezier(.3,1.5,.5,1)}
.fxvs span{display:grid;place-items:center;width:clamp(84px,17vmin,200px);aspect-ratio:1;font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,7.5vmin,5.6rem);color:#1a1408;
  background:linear-gradient(135deg,#fff3c8,var(--gold2) 35%,var(--gold) 75%,#8b6b2c);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);filter:drop-shadow(0 0 30px rgba(240,213,140,.6))}
@keyframes fxslam{0%{opacity:0;transform:translate(-50%,-50%) scale(3) rotate(-20deg)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.fxbot{position:absolute;left:0;right:0;bottom:8vh;display:flex;justify-content:center;flex-wrap:wrap;gap:10px 22px;animation-name:fxrise;font-size:clamp(.8rem,1.7vmin,1.25rem)}
.fxfmt{padding:8px 18px;border:1px solid rgba(200,165,90,.55);background:rgba(10,16,28,.7);text-transform:uppercase;letter-spacing:.22em;font-weight:700;color:var(--gold2)}
.fxcrowd{padding:8px 0;color:var(--mute);text-transform:uppercase;letter-spacing:.16em;font-weight:600}
.fxcrowd b.a{color:var(--teal)}.fxcrowd b.b{color:var(--red)}
@media (max-aspect-ratio:1/1){
  .fx.intro{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
  .fxside{padding:12vh 8vw 6vh}
  .fxside.a{clip-path:polygon(0 0,100% 0,100% 92%,0 100%);margin:0 0 -4vh;padding-bottom:9vh;animation-name:fxst}
  .fxside.b{clip-path:polygon(0 8%,100% 0,100% 100%,0 100%);margin:-4vh 0 0;padding-top:10vh;padding-bottom:14vh;animation-name:fxsb}
  .fxside.a .fxwho,.fxside.b .fxwho{padding:0}
  .fxseam{left:0;right:0;top:50%;bottom:auto;width:auto;height:3px;margin:-1.5px 0 0;transform:skewY(-4deg);background:linear-gradient(90deg,transparent,var(--gold2) 30%,var(--gold2) 70%,transparent)}
  @keyframes fxseam{from{opacity:0;transform:skewY(-4deg) scaleX(0)}}
  .fxtop{top:4vh}.fxbot{bottom:4vh}
  .fxav > span{width:clamp(84px,19vh,200px)}
}
@keyframes fxst{from{transform:translateY(-105%)}}
@keyframes fxsb{from{transform:translateY(105%)}}

/* victory */
.fx.victory,.fx.podium{display:grid;place-items:center}
.fxrays{position:absolute;left:50%;top:50%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;z-index:-1;opacity:.5;
  background:repeating-conic-gradient(from 0deg,rgba(240,213,140,.16) 0 6deg,transparent 6deg 18deg);
  -webkit-mask-image:radial-gradient(circle,#000 0,transparent 45%);mask-image:radial-gradient(circle,#000 0,transparent 45%);animation-name:fxrays;animation-duration:30s;animation-timing-function:linear}
@keyframes fxrays{from{opacity:0;transform:rotate(0)}8%{opacity:.5}to{opacity:.5;transform:rotate(120deg)}}
.fxconf{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.fxcol{display:grid;justify-items:center;gap:clamp(8px,1.6vmin,18px);text-align:center;padding:0 20px;max-width:100%}
.fxeyebrow{display:flex;align-items:center;gap:14px;text-transform:uppercase;letter-spacing:.34em;font-weight:700;color:var(--gold);font-size:clamp(.75rem,1.6vmin,1.15rem);animation-name:fxdrop}
.fxeyebrow i{width:6px;height:6px;background:var(--gold);transform:rotate(45deg)}
.fxav.big > span{width:clamp(130px,30vmin,340px)}
.victory .fxav.big{box-shadow:none;filter:drop-shadow(0 0 40px rgba(240,213,140,.45))}
.fxname.big{font-size:clamp(2.2rem,8vmin,7rem);background:linear-gradient(180deg,#fff7dc,var(--gold2) 45%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;animation-name:fxtrack;animation-duration:1s;filter:drop-shadow(0 4px 24px rgba(200,165,90,.35))}
@keyframes fxtrack{from{opacity:0;letter-spacing:.3em;transform:scale(.94)}}
.fxline{font-size:clamp(1rem,2.4vmin,1.8rem);color:var(--mute);animation-name:fxrise}
.fxline b{color:var(--fg);font-family:var(--display);font-weight:800;margin-right:4px}
.fxadv{margin-top:6px;padding:10px 26px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1408;font-weight:800;letter-spacing:.2em;text-transform:uppercase;font-size:clamp(.75rem,1.6vmin,1.15rem);
  clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,12px 100%,0 50%);animation-name:fxpop}

/* podium */
.pods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:clamp(8px,2vw,34px);width:min(1180px,94vw);height:100%;padding:24vh 0 0}
.pod{display:grid;align-content:end;justify-items:center;gap:clamp(8px,1.6vmin,16px);min-width:0;text-align:center}
.pdwho{display:grid;justify-items:center;gap:6px;min-width:0;max-width:100%;animation-name:fxrise}
.pod .fxav > span{width:clamp(64px,13vmin,170px)}
.pod .fxav.big > span{width:clamp(84px,18vmin,230px)}
.pdn{font-family:var(--display);font-weight:800;font-size:clamp(1rem,3.4vmin,2.6rem);line-height:1.1;max-width:100%;overflow-wrap:anywhere}
.p1 .pdn{color:var(--gold2);font-size:clamp(1.2rem,4.4vmin,3.4rem)}
.pdr{color:var(--mute);font-size:clamp(.7rem,1.5vmin,1.05rem);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdblock{width:100%;display:grid;align-content:start;justify-items:center;gap:4px;padding-top:clamp(12px,2.6vmin,30px);transform-origin:bottom;animation-name:fxgrow;animation-duration:.9s;
  background:linear-gradient(180deg,rgba(200,165,90,.28),rgba(20,30,46,.9) 40%,rgba(10,16,28,.95));border:1px solid rgba(200,165,90,.45);border-bottom:0;border-top:3px solid var(--gold2)}
.p1 .pdblock{height:34vh;background:linear-gradient(180deg,rgba(240,213,140,.45),rgba(40,34,18,.9) 40%,rgba(14,14,10,.96));box-shadow:0 0 60px rgba(240,213,140,.18)}
.p2 .pdblock{height:25vh;border-top-color:#d8dde6}
.p3 .pdblock{height:18vh;border-top-color:#d49a62}
@keyframes fxgrow{from{transform:scaleY(0);opacity:0}}
.pdplace{font-family:var(--display);font-weight:800;font-size:clamp(1.4rem,5.4vmin,4.4rem);line-height:1;color:var(--fg)}
.p1 .pdplace{color:var(--gold2)}
.pdrp{font-family:var(--display);font-weight:800;font-size:clamp(.9rem,2.6vmin,2rem);color:var(--gold2)}
.pdrp small{font-family:var(--body);font-size:.55em;margin-left:5px;color:var(--gold);letter-spacing:.12em}
.podium .fxtop{top:6vh}
@media (max-width:640px){.pods{padding-top:20vh}.pdr{display:none}}
@media (prefers-reduced-motion:reduce){.fx .fa,.fxrays{animation-duration:.01s!important}}

.fxdemo{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;padding:5px 12px;background:rgba(63,183,196,.18);border:1px solid rgba(63,183,196,.5);color:#bdf3f8;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
/* sound toggle */
.sndbtn{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;display:inline-flex;align-items:center;gap:8px;padding:9px 12px;
  background:rgba(16,24,38,.92);border:1px solid var(--line);color:var(--mute);font-size:.78rem;font-weight:600;letter-spacing:.06em}
.sndbtn[aria-pressed=true]{color:var(--gold2);border-color:rgba(200,165,90,.6)}
.sndbtn:hover{border-color:var(--gold)}
.sndi{display:inline-flex}
@media (max-width:640px){.sndbtn .sndl{display:none}}
.stbtn.snd{display:inline-flex;align-items:center;gap:6px}
.stbtn.snd[aria-pressed=false]{opacity:.7}

/* stream HUD: series pips and up next strip */
.pips{display:flex;gap:10px;justify-content:center;align-items:center}
.pips i{width:16px;height:16px;transform:rotate(45deg);border:2px solid rgba(240,213,140,.45);transition:background .4s,box-shadow .4s}
.pips i.on{background:linear-gradient(135deg,#fff3c8,var(--gold2) 50%,var(--gold));border-color:var(--gold2);box-shadow:0 0 14px rgba(240,213,140,.65);animation:pipon .6s cubic-bezier(.3,1.6,.5,1)}
.stlow.noanim .pips i.on{animation:none}
@keyframes pipon{from{transform:rotate(45deg) scale(0)}}
.stream{grid-template-rows:auto minmax(0,1fr) auto auto}
.stnext{justify-self:end;display:flex;align-items:stretch;margin:0 28px 10px;background:rgba(10,16,28,.9);border:1px solid rgba(200,165,90,.4);font-size:.9rem;animation:fxrise .7s cubic-bezier(.2,.8,.2,1) both;max-width:calc(100% - 56px);min-width:0}
.stnext.noanim{animation:none}
.stnext .k{display:grid;place-items:center;padding:0 14px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1408;font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:.68rem}
.stnext .m{display:flex;align-items:center;gap:10px;padding:7px 16px;min-width:0;white-space:nowrap}

/* crowd favourite + upset */
.bfav{font-size:.6rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 10px rgba(240,213,140,.35)}
.vfav{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:.58rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#1a1408;background:linear-gradient(180deg,var(--gold2),var(--gold));padding:2px 9px;clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%);white-space:nowrap;animation:fxrise .4s ease both}
.vcard.fav{padding-top:28px;box-shadow:0 0 0 1px var(--gold2),0 0 28px rgba(240,213,140,.25)}
.stfav{display:inline-block;margin-right:8px;font-size:.66rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#1a1408;background:linear-gradient(180deg,var(--gold2),var(--gold));padding:1px 7px;vertical-align:1px}
.upbadge{display:inline-flex;align-items:center;gap:6px;font-size:.62rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:#fff;background:linear-gradient(90deg,#c2412f,#ff7a3d,#c2412f);background-size:200% 100%;padding:2px 10px 2px 8px;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);white-space:nowrap;animation:upsheen 2.4s linear infinite}

.upbadge.massive{font-size:.66rem;background:linear-gradient(90deg,#b0182d,#ff4d3d,#ffb347,#ff4d3d,#b0182d);background-size:250% 100%;box-shadow:0 0 18px rgba(255,90,60,.55)}
.upbadge.onbcard{position:absolute;z-index:3;top:-11px;left:10px;animation:upsheen 2.4s linear infinite,uppop .55s cubic-bezier(.2,1.6,.4,1) both}
.bcard.upset .binner{box-shadow:0 0 0 1px rgba(255,110,70,.55),0 0 22px rgba(255,90,60,.18)}
.bcard.upset.massive .binner{animation:upglow 2.2s ease-in-out infinite}
.upbadge.inrow{justify-self:start;margin-top:5px;font-size:.56rem}
.rrow.upset{border-left-color:#ff6a3d}
.fxupset{display:grid;justify-items:center;gap:16px;margin:6px 0 6px}
.fxup-t{font-family:var(--display);font-weight:900;text-transform:uppercase;letter-spacing:.06em;font-size:clamp(1.6rem,6vmin,4.6rem);line-height:1;color:#fff;padding:.08em .5em .12em;background:linear-gradient(90deg,#c2412f,#ff7a3d,#c2412f);background-size:200% 100%;clip-path:polygon(.35em 0,100% 0,calc(100% - .35em) 100%,0 100%);transform:rotate(-4deg);animation:upslam .7s cubic-bezier(.2,1.5,.35,1) .7s both,upsheen 2.4s linear 1.4s infinite;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.fxupset.massive .fxup-t{background:linear-gradient(90deg,#b0182d,#ff4d3d,#ffb347,#ff4d3d,#b0182d);background-size:250% 100%;box-shadow:0 0 60px rgba(255,80,50,.5)}
.fxup-s{font-size:clamp(.8rem,1.8vmin,1.2rem);color:#ffb59a;letter-spacing:.08em;animation:fxrise .5s ease 1.1s both}
@keyframes upsheen{to{background-position:-200% 0}}
@keyframes uppop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
@keyframes upslam{0%{transform:rotate(-4deg) scale(2.6);opacity:0;filter:blur(6px)}60%{transform:rotate(-4deg) scale(.92);opacity:1;filter:none}100%{transform:rotate(-4deg) scale(1)}}

/* challenger marquee */
#marq.on{position:relative;display:flex;align-items:stretch;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0c1424,#0a111e);overflow:hidden}
.mq-label{flex:none;display:grid;place-content:center;justify-items:center;padding:0 26px 0 18px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1408;font-size:.58rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%);z-index:2;line-height:1.1}

.mq-view{flex:1;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.mq-track{display:flex;gap:14px;width:max-content;padding:16px 7px 10px;animation:mqscroll linear infinite}
#marq:hover .mq-track{animation-play-state:paused}
.mq-card{position:relative;display:flex;align-items:center;gap:10px;padding:7px 14px 7px 7px;min-width:180px;background:linear-gradient(135deg,#17233a,#111a2b);border:1px solid var(--line)}

.mq-t span{font-size:.7rem;color:var(--mute);white-space:nowrap}
.mq-no{margin-left:auto;padding-left:10px;font-family:var(--display);font-weight:800;color:#3a4a66;font-size:1rem}
.mq-card.new{border-color:rgba(255,120,70,.7);background:linear-gradient(135deg,#2a1a1c,#161b2c);box-shadow:inset 0 0 20px rgba(255,90,60,.18)}
.mq-card.new .pav{box-shadow:0 0 0 2px #ff7a3d,0 0 14px rgba(255,110,60,.6)}
.mq-new{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:.55rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:#fff;padding:2px 9px;white-space:nowrap;background:linear-gradient(90deg,#c2412f,#ff7a3d,#ffb347,#ff7a3d,#c2412f);background-size:250% 100%;clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%);animation:upsheen 1.8s linear infinite,mqflash 1.2s ease-in-out infinite}
.mq-card.new .mq-no{color:#ff9a6a}
@keyframes mqscroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes mqflash{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
@media (max-width:640px){.mq-label{padding:0 18px 0 10px}.mq-label b{font-size:1.1rem}.mq-card{min-width:150px}.mq-card .pav{width:32px;height:32px}}
/* the cat */
.cat{position:fixed;left:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:25;width:58px;height:58px;padding:0;border:0;background:none;cursor:pointer;transform-origin:50% 100%;-webkit-tap-highlight-color:transparent}
.cat[hidden]{display:none}
.ct-body{display:block;width:100%;height:100%;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.ct-body svg{width:100%;height:100%;display:block}
.ct-tail{transform-origin:46px 50px;animation:cttail 1.6s ease-in-out infinite}
.ct-eyes{transform-origin:32px 30px;animation:ctblink 4.5s infinite}
.cat.boop .ct-body{animation:ctboop .35s ease-out}
.cat.mad .ct-body{animation:ctshake .12s linear 6}
.cat.mad .ct-tail{animation-duration:.25s}
.ct-say{position:absolute;bottom:100%;left:50%;margin-bottom:6px;padding:5px 10px;background:#fff;color:#1a1408;font-weight:800;font-size:.8rem;white-space:nowrap;border-radius:10px;transform:translateX(-50%) scaleX(var(--f,1));animation:ctpop .25s cubic-bezier(.2,1.6,.4,1) both;box-shadow:0 6px 16px rgba(0,0,0,.4);pointer-events:none}
.ct-say::after{content:"";position:absolute;top:100%;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:#fff}
.ct-say.angry{background:#ff5a3d;color:#fff;font-size:.95rem;letter-spacing:.02em}
.ct-say.angry::after{border-top-color:#ff5a3d}
@keyframes cttail{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
@keyframes ctblink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes ctboop{0%{transform:scale(1)}40%{transform:scale(1.15,.85)}100%{transform:scale(1)}}
@keyframes ctshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px) rotate(-4deg)}75%{transform:translateX(3px) rotate(4deg)}}
@keyframes ctpop{from{opacity:0;transform:translateX(-50%) scaleX(var(--f,1)) translateY(6px) scale(.6)}to{opacity:1;transform:translateX(-50%) scaleX(var(--f,1))}}
@media (max-width:640px){.cat{width:46px;height:46px}}

/* epic title */
.hero h1.tt{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,3vw,34px);font-size:inherit;text-shadow:none;line-height:1;position:relative}
.hero h1.tt::before{content:"";position:absolute;left:50%;top:55%;width:min(760px,95vw);height:160%;transform:translate(-50%,-50%);z-index:-1;pointer-events:none;
  background:radial-gradient(closest-side,rgba(240,190,90,.22),rgba(240,190,90,.06) 55%,transparent);animation:ttglow 4s ease-in-out infinite}
@keyframes ttglow{50%{opacity:.55;transform:translate(-50%,-50%) scale(.94)}}
.tt-main{display:grid;justify-items:center;gap:6px;min-width:0}
.tt-top{display:flex;align-items:center;gap:12px;animation:ttdrop .7s cubic-bezier(.2,.9,.3,1) both}
.tt-pre{font-family:var(--display);font-weight:800;font-size:clamp(1rem,3.2vw,1.55rem);letter-spacing:.42em;margin-right:-.42em;color:var(--gold2)}
.tt-tag{font-family:var(--body);font-weight:800;font-size:clamp(.78rem,2.2vw,1rem);letter-spacing:.08em;color:#1a1206;padding:3px 10px 2px;
  background:linear-gradient(180deg,#ffe9a8,#e0b45a 55%,#b9853a);clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 50%,calc(100% - 7px) 100%,7px 100%,0 50%);box-shadow:0 0 18px rgba(240,200,110,.5)}
.tt-rule{width:clamp(24px,8vw,90px);height:1px;background:linear-gradient(90deg,transparent,var(--gold));position:relative;transform-origin:right;animation:ttrule .8s .3s cubic-bezier(.2,.9,.3,1) both}
.tt-rule.r{background:linear-gradient(270deg,transparent,var(--gold));transform-origin:left}
.tt-rule::after{content:"";position:absolute;right:-3px;top:-3px;width:7px;height:7px;background:var(--gold2);transform:rotate(45deg)}
.tt-rule.r::after{right:auto;left:-3px}
.tt-big{position:relative;display:block;font-family:var(--display);font-weight:900;font-size:clamp(2.3rem,9.4vw,5.6rem);letter-spacing:.04em;line-height:.95;white-space:nowrap;
  filter:drop-shadow(0 3px 0 #5a3d12) drop-shadow(0 10px 26px rgba(240,180,70,.35))}
.tt-l{display:inline-block;background:linear-gradient(180deg,#fff6d6 0%,#f6dc92 30%,#d9a94e 58%,#a8762c 76%,#f3d68a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:ttslam .6s cubic-bezier(.2,1.5,.4,1) both}
.tt-big::after{content:attr(data-t);position:absolute;inset:0;pointer-events:none;color:transparent;
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.85) 50%,transparent 60%);background-size:250% 100%;background-position:150% 0;-webkit-background-clip:text;background-clip:text;
  animation:ttshine 5.5s ease-in-out 1.6s infinite}
@keyframes ttslam{0%{opacity:0;transform:translateY(-30px) scale(1.8);filter:blur(6px)}60%{opacity:1;filter:blur(0)}100%{opacity:1;transform:none}}
@keyframes ttdrop{from{opacity:0;transform:translateY(-12px);letter-spacing:.8em}to{opacity:1;transform:none}}
@keyframes ttrule{from{transform:scaleX(0);opacity:0}to{transform:none;opacity:1}}
@keyframes ttshine{0%,55%{background-position:150% 0}100%{background-position:-50% 0}}
.tt-static .tt-l,.tt-static .tt-top,.tt-static .tt-rule,.tt-static .pxcat{animation:none}
/* pixel cats */
.pxcat{flex:0 0 auto;width:clamp(48px,9vw,92px);margin-bottom:2px;animation:ttdrop .6s 1s both}
.pxcat.r{transform:scaleX(-1)}
.px-in{display:block;animation:pxbob 1.2s steps(1) infinite}
.pxcat.r .px-in{animation-delay:-.6s}
.pxcat svg{display:block;width:100%;height:auto;image-rendering:pixelated;filter:drop-shadow(0 3px 0 rgba(0,0,0,.45))}
.px-tail{opacity:0}
.px-t0{animation:pxt0 1.2s steps(1) infinite}.px-t1{animation:pxt1 1.2s steps(1) infinite}.px-t2{animation:pxt2 1.2s steps(1) infinite}
.pxcat.r .px-tail{animation-delay:-.3s}
.px-open{animation:pxblink 4s steps(1) infinite}
.pxcat.r .px-open{animation-delay:-1.3s}
.px-heart{opacity:0;animation:pxheart 6s steps(1) infinite}
.pxcat.r .px-heart{animation-delay:-3s}
@keyframes pxbob{0%{transform:translateY(0)}50%{transform:translateY(-4.4%)}}
@keyframes pxt0{0%{opacity:1}25%{opacity:0}75%{opacity:0}}
@keyframes pxt1{0%{opacity:0}25%{opacity:1}50%{opacity:0}75%{opacity:1}}
@keyframes pxt2{0%{opacity:0}50%{opacity:1}75%{opacity:0}}
@keyframes pxblink{0%{opacity:1}94%{opacity:0}97%{opacity:1}}
@keyframes pxheart{0%{opacity:0}80%{opacity:1}96%{opacity:0}}
@media (max-width:520px){.hero h1.tt{gap:8px}.pxcat{width:40px}.tt-big{font-size:clamp(1.9rem,10vw,2.6rem);letter-spacing:.02em}.tt-pre{letter-spacing:.3em;margin-right:-.3em}.tt-top{gap:8px}}

/* RP gifting note */
.giftnote{display:flex;gap:16px;align-items:flex-start;margin-top:22px;padding:16px 18px;position:relative;
  background:linear-gradient(100deg,rgba(63,183,196,.12),rgba(20,30,46,.6) 60%);border:1px solid rgba(63,183,196,.35);border-left:3px solid var(--teal)}

.gn-ic svg{width:22px;height:22px}
.gn-t{display:grid;gap:6px;min-width:0}
.gn-k{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);font-weight:700}
.gn-t b{font-size:1.02rem;color:var(--fg)}

/* bracket interactivity */
.bcard{transition:transform .25s ease-out,opacity .3s,filter .3s}
.bcard.tilt{transition:transform .08s linear,opacity .3s,filter .3s;z-index:4}
.bcard.openable{cursor:pointer}
.bcard.openable:focus-visible{outline:2px solid var(--teal);outline-offset:4px}
.bglare{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,240,200,.16),transparent 55%);mix-blend-mode:screen}
.bcard.tilt .bglare{opacity:1}

.bstage.focusing .bhead{opacity:.6}
.bstage .bp.hl{background:linear-gradient(90deg,rgba(63,183,196,.22),rgba(63,183,196,.04))}

.ln.charge{stroke:#ff8a5c;stroke-width:2.5;stroke-dasharray:4 10;filter:drop-shadow(0 0 5px rgba(255,110,70,.8));animation:lnflow .7s linear infinite}
.bcard.justwon .binner::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(100deg,transparent 30%,rgba(255,236,170,.55) 50%,transparent 70%);background-size:250% 100%;animation:bjw 1.2s ease-out 2 both}
.bcard.justwon{animation:bjwglow 1.6s ease-out}
@keyframes bjw{from{background-position:150% 0}to{background-position:-50% 0}}
@keyframes bjwglow{0%,100%{filter:drop-shadow(0 8px 18px rgba(0,0,0,.55))}30%{filter:drop-shadow(0 0 26px rgba(240,213,140,.9))}}
.bp.arrive{animation:barrive 1.1s .5s cubic-bezier(.2,1.2,.4,1) backwards}

@keyframes barrive{0%{opacity:0;transform:translateX(-40px);background:rgba(240,213,140,.45)}60%{opacity:1;transform:none;background:rgba(240,213,140,.25)}100%{background:transparent}}
@keyframes barrav{0%,40%{box-shadow:inset 0 0 0 2px var(--gold2),0 0 22px rgba(240,213,140,1)}}
.bchamp.arrive{animation:barrch 1.8s .6s ease-out backwards}
@keyframes barrch{0%{transform:scale(.9);box-shadow:0 0 0 rgba(240,213,140,0)}40%{transform:scale(1.04);box-shadow:0 0 60px rgba(240,213,140,.8)}100%{transform:none}}
.pathchip{position:relative;z-index:6;width:max-content;max-width:calc(100% - 32px);margin:10px auto 0;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 8px;
  background:rgba(12,22,34,.94);border:1px solid rgba(63,183,196,.6);box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 20px rgba(63,183,196,.2);font-size:.88rem;animation:uppop .35s cubic-bezier(.2,1.4,.4,1) both}

    h("label", {style:"display:flex;gap:8px;align-items:center;flex-direction:row"}, h("input", {type:"checkbox", checked:soundOn() ? true : null, onchange:function(e){ setSound(e.target.checked); }}), "Sound cues on this screen (roll, strikes, lock-in, intro, victory, podium)")));
  // live control
  var mf = h("fieldset", null, h("legend", null, "Matches" + (sandbox ? " (test)" : "")));
  mf.appendChild(h("div", {class:"row"},
    h("button", {class:"sbtn", type:"button", disabled: S.undo.length ? null : true, onclick:undo}, "Undo last game"),
    h("span", {class:"hint"}, "Click names in the bracket to record game wins.")));
  if (!B) mf.appendChild(h("p", {class:"hint"}, "Build the bracket first."));
  else B.order.forEach(function(m){
    if (!m.ready) return;
    var live = S.live === m.key;
    var row = h("div", {class:"mrow"},
      h("div", {class:"mt"}, matchLabel(B, m), m.winner ? " · done" : ""),
      h("div", null, h("b", null, pname(m.a)), " ", m.score[0], " – ", m.score[1], " ", h("b", null, pname(m.b))));
    if (!m.winner){
      row.appendChild(h("div", {class:"gbtns"},
        h("button", {class:"sbtn" + (live ? " on" : ""), type:"button", onclick:function(){ if (!live && m.a && m.b) pushFx({t:"intro", key:m.key, at:Date.now()}); S.live = live ? null : m.key; autoRoll(); commit(); }}, live ? "Live now (click to clear)" : "Set as live"),
        h("button", {class:"sbtn", type:"button", onclick:function(){ addGame(m.key, m.a); }}, "+1 " + pname(m.a)),
        h("button", {class:"sbtn", type:"button", onclick:function(){ addGame(m.key, m.b); }}, "+1 " + pname(m.b))));
      var gi = gameIndex(m);
      row.appendChild(field("Champion for game " + (gi+1) + (m.need === 1 || gi === 2 ? " (use the roller)" : " (the player's pick)"),
        champPicker(champFor(m.key, gi), function(v){ var a = S.champs[m.key] = S.champs[m.key] || []; a[gi] = v || null; markDirty(); })));
      var VV = voteOf(m.key);
      row.appendChild(h("p", {class:"hint"}, "Crowd votes: " + (VV.a|0) + " for " + pname(m.a) + ", " + (VV.b|0) + " for " + pname(m.b) + "."));
    } else {
      row.appendChild(h("div", {class:"gbtns"}, confirmBtn("clr"+m.key, "Clear result", "warn", function(){ clearResult(m.key); })));
    }
    mf.appendChild(row);
  });
  body.appendChild(mf);

  // sign-ups
  body.appendChild(h("fieldset", null, h("legend", null, "Sign-ups"),
    h("p", {class:"hint"}, sandbox ? "Test mode uses fake players." : (S.seeds && S.seeds.length) ? "The bracket is drawn, so sign-ups are closed. Remove the bracket to reopen them." : "Anyone with the link can sign up with their Discord name, Riot ID and an icon. Close sign-ups when you're ready to draw."),
    (!sandbox && !(S.seeds && S.seeds.length)) ? h("label", {style:"display:flex;gap:8px;align-items:center;flex-direction:row"}, h("input", {type:"checkbox", checked:S.signupsOpen !== false ? true : null, onchange:function(e){ S.signupsOpen = e.target.checked; commit(); }}), "Sign-ups open") : null));
  // players
  var pf = h("fieldset", null, h("legend", null, "Players (" + S.players.length + ")"));
  pf.appendChild(h("p", {class:"hint"}, "List order is the seeding order: top of the list is seed 1."));
  S.players.forEach(function(p, i){
    pf.appendChild(h("div", {class:"prow"},
      h("div", {class:"pickbtn"}, pav(p.id, "md"), h("button", {class:"sbtn", type:"button", onclick:function(){ openIconPicker(p); }}, "Choose profile icon")),
      field("Discord name", inp(p.name, function(v){ p.name = v; })),
      field("Riot ID", inp(p.riot, function(v){ p.riot = v; }, {placeholder:"Name#TAG"})),
      field("Trash talk (optional)", inp(p.quote, function(v){ p.quote = v; })),
      h("div", {class:"acts"}, h("span", null, "Seed " + (i+1)),
        h("button", {class:"sbtn ix", type:"button", "aria-label":"Move up", disabled: i ? null : true, onclick:function(){ S.players.splice(i-1, 0, S.players.splice(i,1)[0]); markDirty(); renderDrawer(); }}, "↑"),
        h("button", {class:"sbtn ix", type:"button", "aria-label":"Move down", disabled: i < S.players.length-1 ? null : true, onclick:function(){ S.players.splice(i+1, 0, S.players.splice(i,1)[0]); markDirty(); renderDrawer(); }}, "↓"),
        confirmBtn("rm"+p.id, "Remove", "warn", function(){ if (!sandbox) removedIds.push(p.id); S.players.splice(i,1); markDirty(); renderDrawer(); }))));
  });
  pf.appendChild(h("button", {class:"sbtn", type:"button", onclick:function(){ S.players.push({id:uid(), name:"Player " + (S.players.length+1), riot:"", main:"", quote:""}); markDirty(); renderDrawer(); }}, "+ Add player"));
  body.appendChild(pf);

  // bracket
  var started = Object.keys(S.games).length > 0;
  var bf = h("fieldset", null, h("legend", null, "Bracket"),
    h("p", {class:"hint"}, "Works with any number of players; top seeds get byes when the count isn't a power of 2. Rebuilding wipes all results."),
    S.seeds.some(function(id){ return id && !P(id); }) ? h("p", {class:"hint", style:"color:var(--red)"}, "A player in the bracket was removed. Rebuild the bracket.") : null,
    h("div", {class:"gbtns", style:"display:flex;gap:6px;flex-wrap:wrap"},
      (started ? confirmBtn.bind(null, "shuf") : function(l,c,f){ return h("button", {class:"sbtn "+c, type:"button", onclick:f}, l); })("Shuffle & draw", "primary", function(){
        if (S.players.length < 2) { setStatus("Add at least 2 players first"); return; }
        for (var i=S.players.length-1; i>0; i--){ var j = Math.floor(Math.random()*(i+1)); var t=S.players[i]; S.players[i]=S.players[j]; S.players[j]=t; }
        buildSeeds(S.players.map(function(p){ return p.id; })); commit(); }),
      (started ? confirmBtn.bind(null, "seed") : function(l,c,f){ return h("button", {class:"sbtn "+c, type:"button", onclick:f}, l); })("Draw in list order (seeded)", "", function(){
        if (S.players.length < 2) { setStatus("Add at least 2 players first"); return; }
        buildSeeds(S.players.map(function(p){ return p.id; })); commit(); }),
      S.seeds.length ? confirmBtn("wipe", "Remove bracket", "warn", function(){ S.seeds = []; S.games = {}; S.undo = []; S.live = null; S.votes = {}; S.champs = {}; S.draft = null; S.fx = []; S.rolls = []; if (!sandbox) resetVotesNext = true; commit(); }) : null));
  body.appendChild(bf);

  // event
  body.appendChild(h("fieldset", null, h("legend", null, "Event"),
    field("Tournament name", inp(S.name, function(v){ S.name = v; })),
    field("Start time (your local time)", inp(toLocalInput(S.start), function(v){ var d = new Date(v); if (!isNaN(d)) S.start = d.toISOString(); }, {type:"datetime-local"})),
    field("Discord stream link", inp(S.stream, function(v){ S.stream = v.trim(); }, {type:"url", placeholder:"https://discord.com/channels/..."}))));

  // pool
  body.appendChild(h("fieldset", null, h("legend", null, "Champion roller"),
    h("div", {class:"gbtns", style:"display:flex;gap:6px;flex-wrap:wrap"},
      h("button", {class:"sbtn primary", type:"button", onclick:function(){ newDraft(false); }}, "Roll for real"),
      h("button", {class:"sbtn", type:"button", onclick:function(){ newDraft(true); }}, "Test roll"),
      S.rolls.length ? confirmBtn("clrrolls", "Clear history", "warn", function(){ S.rolls = []; commit(); }) : null),
    h("p", {class:"hint"}, "A real roll is tied to the live match and fills in its champion when the strikes are done. A test roll is only on your screen."),
    field("Pool: one champion per line (" + S.pool.length + ")", h("textarea", {value:S.pool.join("\n"), style:"min-height:160px", oninput:function(e){ S.pool = e.target.value.split("\n").map(function(x){ return x.trim() ? canon(x) : ""; }).filter(Boolean); markDirty(); }}))));

  // prizes
  var zf = h("fieldset", null, h("legend", null, "Prizes"));
  S.prizes.forEach(function(p){
    zf.appendChild(h("div", {class:"row"},
      field("Place", inp(p.place, function(v){ p.place = v; })),
      field("Price", inp(p.gbp, function(v){ p.gbp = v; })),
      field("RP", inp(p.rp, function(v){ p.rp = parseInt(v,10)||0; }, {type:"number", min:"0"}))));
  });
  body.appendChild(zf);

  // admin access
  var codeI = h("input", {type:"password", autocomplete:"new-password", placeholder:"New admin code (8+ characters)"});
  body.appendChild(h("fieldset", null, h("legend", null, "Admin access"),
    h("p", {class:"hint"}, "Only someone with the admin code can open this panel. Change it after your first login."),
    h("div", {class:"row"}, codeI, h("button", {class:"sbtn", type:"button", onclick:async function(){
      try { await rpc("admin_set_code", {pass:adminPass, new_code:codeI.value}); adminPass = codeI.value; lsSet("puupAdmin", adminPass); codeI.value = ""; setStatus("Admin code changed"); toast("Admin code changed"); }
      catch(e){ setStatus(e.message); toast(e.message); } }}, "Change code")),
    h("button", {class:"sbtn warn", type:"button", onclick:logoutAdmin}, "Log out of admin on this device")));
  // rules
  body.appendChild(h("fieldset", null, h("legend", null, "Rules"),
    field("One rule per line", h("textarea", {value:S.rules.join("\n"), oninput:function(e){ S.rules = e.target.value.split("\n"); markDirty(); }}))));

  statusEl = h("span", {class:"st"}, lastStatus || (dirty ? "Unsaved changes" : "All changes saved"));
  drawer = h("aside", {class:"drawer", "aria-label":"Admin panel"},
    h("header", null, h("h3", null, "Admin"), h("button", {class:"sbtn", type:"button", onclick:function(){ drawerOpen = false; drawer.remove(); drawer = null; render(); }}, "Close")),
    body,
    h("div", {class:"dfoot"}, statusEl, h("button", {class:"sbtn primary", type:"button", disabled: sandbox ? true : null, onclick:publish}, "Save now")));
  document.body.appendChild(drawer);
}

/* ---------- boot ---------- */
try { if (!location.hash && sessionStorage.getItem("sndStream") === "1") location.hash = "stream"; } catch(e){}
window.addEventListener("hashchange", function(){
  if (location.hash === "#admin"){ openLogin(); return; }
  if (drawer && location.hash === "#stream"){ drawerOpen = false; drawer.remove(); drawer = null; }
  render();
});
var rsT = null; window.addEventListener("resize", function(){ if (location.hash !== "#stream") return; clearTimeout(rsT); rsT = setTimeout(render, 150); });
document.addEventListener("visibilitychange", function(){ if (!document.hidden) refresh(); });
render();
(async function(){
  if (adminPass){
    try { if (await rpc("admin_check", {pass:adminPass})){ isAdmin = true; } else { adminPass = ""; lsSet("puupAdmin", ""); } } catch(e){}
  }
  await refresh(true);
  if (isAdmin){ render(); }
  setTimeout(pollLoop, 2500);
  if (location.hash === "#admin") openLogin();
})();
})();
</script>
</body>
</html>
